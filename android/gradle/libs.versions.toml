# Versions are pinned to a set that is known to work together. AGP, Kotlin,
# KSP and the Compose compiler plugin are coupled — bump them as a group, not
# individually.

[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.6"
hilt = "2.60.1"
hiltNavigation = "1.4.0"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.1"
composeBom = "2026.09.00"
media3 = "1.11.1"
retrofit = "3.0.0"
retrofitSerialization = "1.0.0"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"
coil = "3.6.3"
datastore = "1.2.1"
mediarouter = "1.8.1"
room = "2.8.5"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
# Gradle Play Publisher. Held at 3.x deliberately: 4.0.0 was the AGP 9 port and
# its release notes say compatibility with older AGP or Gradle is not
# supported, so it cannot move until `agp` above does.
playPublisher = "4.1.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Adaptive layouts for large screens. All three are managed by the Compose BOM
# above — the adaptive pair at 1.0.0, the navigation suite at 1.3.1 — so they
# carry no version of their own, exactly like material3 beside them.
#
# Do not pin the adaptive pair to 1.1.x on this BOM. Its floor is Compose 1.8,
# and Gradle resolves highest-wins between a platform *constraint* (the BOM's
# 1.7.6) and a hard *requirement*, so compose-ui would silently jump to 1.8
# while material3 stayed at 1.3.1. Predictive back for panes
# (NavigableListDetailPaneScaffold, added in adaptive 1.1.0-alpha04) therefore
# waits for a BOM bump, as its own change.
#
# adaptive-navigation is deliberately absent: it exists for
# ThreePaneScaffoldNavigator, and the pane layout keeps its own List<Route>
# instead. See ARCHITECTURE.md on why a second back stack is not wanted.
androidx-compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
androidx-compose-adaptive = { module = "androidx.compose.material3.adaptive:adaptive" }
androidx-compose-adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
# Video the server can only re-encode arrives chunked with no Content-Length,
# so it is played through hls.m3u8 instead — the one way to get a working seek
# bar over it. DefaultMediaSourceFactory picks HlsMediaSource up from the
# classpath, so nothing but this line is needed to enable it.
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
# Reached transitively through media3-exoplayer, but declared because the cache
# uses them directly — SimpleCache, CacheDataSource and the index database.
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-database = { module = "androidx.media3:media3-database", version.ref = "media3" }

# Cast (deferred, see CAST.md). Only the FOSS route-picker UI is needed —
# the Cast protocol itself is ported from src/castmanager.cc, so neither
# media3-cast nor play-services-cast-framework is a dependency. Not yet
# wired into :app.
androidx-mediarouter = { module = "androidx.mediarouter:mediarouter", version.ref = "mediarouter" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# Bridges suspend functions to the ListenableFutures the Media3 session
# callbacks return. Guava is already on the classpath via media3-common.
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# The offline library mirror and the pin list; see CACHING.md.
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
