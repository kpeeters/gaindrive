<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>GainDrive</title>
   <link rel="stylesheet" href="style.css">
   <!-- Apply saved theme before first paint to avoid a flash. -->
   <script>(function(){var t=localStorage.getItem('gd_theme');if(t)document.documentElement.classList.add(t);})();</script>
</head>
<body>

<div id="login-screen">
   <div class="login-card">
      <h1>GainDrive</h1>
      <form id="login-form">
         <label for="server">Server</label>
         <input type="url" id="server" placeholder="https://music.example.com" required autocomplete="url">

         <label for="username">Username</label>
         <input type="text" id="username" required autocomplete="username">

         <label for="password">Password</label>
         <input type="password" id="password" required autocomplete="current-password">

         <button type="submit">Connect</button>
         <p id="login-error" class="error" hidden></p>
      </form>
   </div>
</div>

<div id="app-shell" hidden>
   <nav id="sidebar">
      <div class="nav-title">GainDrive</div>
      <ul>
         <li><a href="#" data-view="artists">Artists</a></li>
         <li><a href="#" data-view="playlists">Playlists</a></li>
         <li><a href="#" data-view="recents">Recents</a></li>
      </ul>
      <ul class="nav-bottom">
         <li><a href="#" data-view="settings">Settings</a></li>
         <li><a href="#" data-view="admin">Admin</a></li>
         <li><button id="theme-toggle" class="theme-btn" title="Cycle theme: auto / light / dark">Auto</button></li>
      </ul>
   </nav>

   <div id="pane-viewport">
      <div id="pane-strip">
         <div class="pane" id="pane-artists"></div>
         <div class="pane" id="pane-albums"></div>
         <div class="pane" id="pane-tracks"></div>
      </div>
   </div>

   <nav id="bottom-nav">
      <a href="#" data-view="artists"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg><span>Artists</span></a>
      <a href="#" data-view="playlists"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg><span>Playlists</span></a>
      <a href="#" data-view="recents"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg><span>Recents</span></a>
      <a href="#" data-view="settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg><span>Settings</span></a>
   </nav>

   <footer id="player">
      <img id="player-cover" src="" alt="" width="48" height="48">
      <div id="player-info">
         <span id="player-title">—</span>
         <span id="player-artist"></span>
      </div>
      <div id="player-controls">
         <button id="player-prev"      title="Previous">⏮</button>
         <button id="player-playpause" title="Play">▶</button>
         <button id="player-next"      title="Next">⏭</button>
         <button id="player-cast"      title="Cast"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M1 18v3h3a3 3 0 0 0-3-3zm0-4v2a7 7 0 0 1 7 7h2a9 9 0 0 0-9-9zm0-4v2a11 11 0 0 1 11 11h2A13 13 0 0 0 1 10zm20-6H3C1.9 4 1 4.9 1 6v3h2V6h18v12h-7v2h7c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"/></svg></button>
      </div>
      <input id="player-seek" type="range" value="0" min="0" step="1">
      <span id="player-time">0:00 / 0:00</span>
   </footer>
</div>

<div id="cast-modal" class="modal hidden">
   <div class="modal-box">
      <h3>Cast to device</h3>
      <div id="cast-device-list">Discovering…</div>
      <div id="cast-stop-row" class="hidden">
         <button id="cast-stop-btn">Stop casting</button>
      </div>
      <button id="cast-close-btn">Close</button>
   </div>
</div>

<script src="app.js"></script>
</body>
</html>
