# The gaindrive API extensions — the single source of truth.
#
# Everything gaindrive adds to the Subsonic/OpenSubsonic surface is written
# here and nowhere else, in the same sense that VERSION is the only place the
# version is written.  html/api.html is generated from this file by
# doc/gen_api_html.py; never edit that page.  API.md documents the standard
# endpoints and points here for the rest.
#
# Regenerate with:   make api-html
#
# ---------------------------------------------------------------------------
# Two rules that are not style preferences:
#
#  * Prose uses TOML *literal* strings — '...' and '''...'''.  A basic
#    (double-quoted) string processes backslash escapes and a lone \ is a
#    parse error, and some of the prose below contains one verbatim.  Double
#    quotes are for identifiers, which never contain a backslash.
#
#  * Anything that gets printed is a string, numbers included: default = '50'.
#    Booleans appear only in `required` and `repeatable`, which are logic and
#    are never rendered, so Python's True cannot reach the page.
#
# ---------------------------------------------------------------------------
# The markdown subset accepted in `blurb`, `notes` and `doc`.  Nothing else is
# supported; the generator warns on stderr about a line that looks like it
# wanted something more.
#
#    blank line       paragraph break
#    * item           star list (a run of them becomes one list)
#    `code`           inline code
#    **bold**  *em*
#    [text](url)      link; http(s), #anchor or *.html only
#    NOTE: ...        a paragraph opening with this becomes a callout box
#
# ---------------------------------------------------------------------------
# Entry kinds:
#
#    kind = 'endpoint'    a gaindrive endpoint, documented in full.
#                         Requires `name`.  `version` is optional and defaults
#                         to '1'; set it only on an endpoint added by a later
#                         extension version, which is then the only one badged.
#    kind = 'additions'   a standard Subsonic endpoint that carries gaindrive
#                         parameters or fields.  Requires `applies_to`; only
#                         the additions are listed, never what the host
#                         endpoint does.  Everything under such an entry is an
#                         extension by construction.
#
# `applies_to` names hosts as text; a name matching an endpoint defined here
# is rendered as a link.

[meta]
extension = "gaindrive"
title     = "GainDrive API extensions"
intro     = '''
GainDrive speaks the [Subsonic](https://opensubsonic.netlify.app/) API, and
this page documents only what it *adds* to it: the endpoints Subsonic does not
define, and the extra parameters and response fields that standard endpoints
carry. The standard endpoints themselves behave as specified and are not
repeated here.

Everything is served at `/rest/<name>.view` unless stated otherwise, answers
in XML or in JSON (`f=json`), and requires authentication — either `u` and `p`
or the token scheme `u`, `t` and `s`. A parameter marked with a `*` is
required.

Clients discover this whole surface through `getOpenSubsonicExtensions`, which
advertises an extension named `gaindrive`.
'''


# ===========================================================================
# Sections.  File order is page order and sidebar order.
# ===========================================================================

[[section]]
id    = "extension"
title = "The gaindrive extension"
group = "Overview"
blurb = '''
`getOpenSubsonicExtensions` advertises an extension named `gaindrive` at
version 1. No authentication is needed for that call, so a client can negotiate
before login. Everything on this page is version 1.

A new *endpoint* will earn a new version, because a client cannot discover one
without being told. A new *optional parameter* on an endpoint an existing
version already names will not — a client that ignores it gets exactly what it
got before, so nothing it was told has been redefined.

A client that does not know the extension will not call any of these, so there
is no conformance risk in advertising it. Nothing in the standard endpoints
changes when the extension is present.
'''

[[section]]
id    = "browsing"
title = "Browsing"
group = "Library"

[[section]]
id    = "playback"
title = "Playback"
group = "Library"

[[section]]
id    = "video"
title = "Video"
group = "Library"

[[section]]
id    = "albumtext"
title = "Album text and images"
group = "Library"
blurb = '''
Liner notes and scans that sit alongside the audio as ordinary files.
'''

[[section]]
id    = "metadata"
title = "Metadata editing"
group = "Editing"

[[section]]
id    = "settings"
title = "Server settings"
group = "Editing"
blurb = '''
Admin only, and JSON only — these carry credentials for third-party services
and have no XML representation.
'''

[[section]]
id    = "users"
title = "Users"
group = "Editing"

[[section]]
id    = "upload"
title = "Upload"
group = "Personal files"
blurb = '''
Each upload is extracted into `<uploads root>/<username>/<uuid>/` so that
archives with a missing or messy artist/album structure stay isolated and the
scanner always has a stable artist-level root to work from.

**That isolation ends when the upload succeeds.** Each artist directory is
then merged into the one the account already has under an earlier batch, and
the emptied batch is removed. So uploading two archives that name the same
artist gives one artist holding both albums, and fetching several tracks into
one album adds them to it rather than making a second album of the same name.
Colliding files are suffixed, never overwritten. `fetchUrl` shares this step,
which is why `artist` and `album` behave identically on both: a blank or
absent value keeps what the source supplied, and a value holding nothing
usable once sanitised is refused rather than silently ignored.
'''

[[section]]
id    = "urlfetch"
title = "Fetching from a URL"
group = "Personal files"
blurb = '''
The second way something reaches a personal folder: instead of uploading an
archive, paste a URL and let the server fetch it with an external tool. All
four endpoints require `uploadRole` or admin and return error 50 without it.

The server matches the URL against a table of handlers configured by the
operator. **A URL matching no handler is refused, and that refusal is the
security boundary** — without it, any account allowed to upload could make the
server issue outbound requests to anywhere it can reach, including hosts
unreachable from outside the network. Only `http` and `https` URLs are
considered at all.

A fetch runs in the background, one at a time, and the request returns
immediately with a job id. The job's state is one of `queued`, `running`,
`scanning`, `done`, `error` or `cancelled`; **the library scan happens before
`done`**, so a client seeing `done` can re-read the listing with no further
wait. A failed, timed-out or cancelled job deletes its batch directory.
'''

[[section]]
id    = "cast"
title = "Chromecast"
group = "Casting"
blurb = '''
Casting is server-driven: the browser asks gaindrive to load a URL onto the
Chromecast, and the device then fetches the media from `stream` itself using a
token. All seven endpoints require `castRole` in addition to authentication,
and return error 50 without it. `stream` and `getCaptions` are exempt when
called with a valid `castToken`, since only `castLoad` ever issues one.

**A session belongs to one account *and* one client instance.** The client half
is the `castController` parameter — an opaque id the client makes up once and
keeps. `startCast` requires it and records the pair; every other endpoint here
compares against it, and a caller that does not match is treated as having no
session at all: `castSession` reports inactive, `castEvents` answers 204,
`castLoad` and `castControl` return error 0, and `stopCast` succeeds without
stopping anything.

That is also what keeps `stream` honest. While a session is live, `stream`
answers 204 to the session's **owner** and redirects playback to the receiver;
everyone else is served normally. Without the owner test it answered 204 to
every caller in the server, so playing a track in one client sent it to
whatever receiver another client had most recently picked.

The id cannot be the standard `c=` parameter, which names the kind of client
rather than the instance — every browser sends the same value, so two of one
user's browsers could not be told apart. For the same reason there is no
fallback to `c=` when `castController` is absent: two installs of one app would
collapse into a single identity. A caller that sends none simply never owns a
session, which is what every client that does not drive these endpoints wants.

`castController` is **not a credential** and authorises nothing. Authentication
is unchanged, and the id only breaks ties among one account's own devices.

Only one session exists at a time, because the server holds one control
channel. `startCast` from a different owner therefore takes the session over:
the previous owner's receiver is stopped and its `castEvents` stream is
dropped, so its UI leaves cast mode by itself.

The token is minted per `castLoad` and is scoped to what that load declared —
one song, and the caption ids offered for it. It is not a general credential:
presenting it for any other id is refused exactly as if it were absent.
'''


# ===========================================================================
# Overview
# ===========================================================================

[[endpoint]]
kind       = 'additions'
applies_to = ["getOpenSubsonicExtensions"]
section    = "extension"
auth       = 'none'
summary    = 'Advertises the gaindrive extension and the versions this server implements.'

  [[endpoint.field]]
  name = "openSubsonicExtensions.name"
  type = "string"
  doc  = 'Always `gaindrive`.'

  [[endpoint.field]]
  name = "openSubsonicExtensions.versions"
  type = "int[]"
  doc  = 'In XML, a comma-separated `versions` attribute.'


# ===========================================================================
# Browsing
# ===========================================================================

[[endpoint]]
kind    = 'endpoint'
name    = "getRecentSongs"
section = "browsing"
summary = 'Recently played tracks for the authenticated user, newest first.'

  [[endpoint.param]]
  name    = "size"
  type    = "int"
  default = '50'
  doc     = 'How many to return. Clamped to 1..500.'

  [[endpoint.param]]
  name    = "offset"
  type    = "int"
  default = '0'
  doc     = 'How many to skip.'

  [[endpoint.field]]
  name = "recentSongs.song"
  type = "Child[]"
  doc  = 'Ordinary song entries, newest first.'

  [[endpoint.field]]
  name = "lastPlayed"
  type = "string"
  on   = "song"
  doc  = 'When the play this entry reports happened.'

[[endpoint]]
kind       = 'additions'
applies_to = ["getMusicFolders"]
section    = "browsing"
summary    = 'Each root says which of the two library layouts it holds.'

  [[endpoint.field]]
  name  = "contentType"
  type  = "string"
  on    = "musicFolder"
  doc   = '`artists` or `categories`.'
  notes = '''
Artist and category roots cannot be told apart by shape — both are
`L1/L2/[L3]/files` — so which one a root is has to be configured, and a client
that wants to draw them differently has to be told.

The uploads root, if configured, is never listed: it holds per-user personal
files rather than shared library content.
'''

[[endpoint]]
kind       = 'additions'
applies_to = ["getIndexes", "getArtists"]
section    = "browsing"
summary    = 'Narrow the listing to one kind of root, or replace it with the uploads area.'
notes      = '''
Root folders themselves never appear as artists. Both endpoints return the
*level-1 entries* of every root flattened into one list — musicians from
artist roots and sections such as Film or Series from category roots.

Nothing below the top level is affected: `getArtist`, `getAlbum` and
`getMusicDirectory` take plain ids and neither know nor need to know which
side of the library one came from.
'''

  [[endpoint.param]]
  name   = "contentType"
  type   = "string"
  values = ["artists", "categories"]
  doc    = 'Restrict to roots of one kind.'
  notes  = '''
It complements `musicFolderId` rather than replacing it: a kind may span
several roots — two artist roots must list together — which a single folder id
cannot express.

Omitting it returns every root's children mixed, which is what a client with
no concept of categories should get. The sections browse perfectly well as
pseudo-artists.
'''

  [[endpoint.param]]
  name   = "personal"
  type   = "string"
  values = ["true", "*"]
  doc    = 'Replace the shared library with the uploads area.'
  notes  = '''
* `personal=true` — the calling account's own uploads.
* `personal=*` — **every** account's, and **admin only**; anything else gets
  error 50. An admin is the only account that can `moveAlbum` an upload
  into the shared library, so without this a non-admin's upload is visible to
  its owner and to nobody able to act on it.

**`personal=*` groups the response by owner rather than by first letter**, so
the `index` labels come back as usernames instead of `A`, `B`, `#`. That is
what makes two accounts' identically named folders tellable apart — grouped by
letter they would interleave under one heading with nothing saying whose is
whose — and it needs nothing new from a client, since an index label was
always an arbitrary string.

NOTE: A client drawing an alphabet scrubber from those labels will want to
suppress it when they are not letters.
'''

[[endpoint]]
kind       = 'additions'
applies_to = ["getAlbumList", "getAlbumList2", "search2", "search3"]
section    = "browsing"
summary    = 'Search and list within the uploads area instead of the shared library.'

  [[endpoint.param]]
  name   = "personal"
  type   = "bool"
  values = ["true"]
  doc    = "The calling account's own uploads. Unlike on `getIndexes`, `personal=*` is not accepted here."

[[endpoint]]
kind       = 'additions'
applies_to = ["getCoverArt"]
section    = "browsing"
summary    = 'Reach the extra images in an album folder, beyond the cover.'

  [[endpoint.param]]
  name    = "index"
  type    = "int"
  default = '0'
  doc     = '0 is the main cover; 1 and up select the extras `getAlbumImages` counted.'

[[endpoint]]
kind       = 'additions'
applies_to = ["getArtistInfo", "getArtistInfo2"]
section    = "browsing"
summary    = 'Re-ask the metadata providers for an artist rather than answering from cache.'

  [[endpoint.param]]
  name  = "force"
  type  = "bool"
  doc   = 'Bypass the cached `artist_info_cache` row and query the providers again.'
  notes = '''
The chain is MusicBrainz, then Wikidata, Wikipedia, TheAudioDB and Discogs,
paced against MusicBrainz's rate limit, so a forced lookup is not instant.
'''

[[endpoint]]
kind       = 'additions'
applies_to = ["any endpoint returning song entries"]
section    = "browsing"
summary    = 'One extra field on every song entry.'

  [[endpoint.field]]
  name  = "transcodedBitRate"
  type  = "int"
  on    = "Child"
  doc   = 'The bitrate the stream would carry, in kbps, when this entry would be transcoded.'
  notes = '''
Subsonic defines `transcodedContentType` and `transcodedSuffix` but no
bitrate, so a client could see that a track would be converted without being
able to say to what. It is computed the same way `stream` decides, including
the account's own ceiling, so the two cannot disagree.
'''


# ===========================================================================
# Playback
# ===========================================================================

[[endpoint]]
kind       = 'additions'
applies_to = ["stream"]
section    = "playback"
summary    = 'Four gaindrive parameters on the standard streaming endpoint.'

  [[endpoint.param]]
  name  = "pace"
  type  = "bool"
  doc   = 'Deliver at roughly 1x playback rate rather than as fast as the socket takes it.'
  notes = '''
Send it when the URL is being handed to something that will play it in real
time and cannot be recognised from the request — a Cast receiver fetching for
itself is the case it exists for. Without it such a receiver is sent the whole
track at once, stops reading when its buffer fills, and the connection is then
idle until its own 60-second no-data timeout, or a reverse proxy's, kills it
mid-track.

**Never send it on a download or a prefetch**: that would make the transfer
take as long as the music. A browser is paced already, by its User-Agent, and
video is never paced.
'''

  [[endpoint.param]]
  name  = "castToken"
  type  = "string"
  doc   = 'The token minted by `castLoad`, accepted in place of credentials.'
  notes = '''
A Chromecast fetches the media for itself and has no account, so the token is
what authorises it. It is not single-use per request — the receiver makes many
range requests for one track — but it **is** scoped to the song `castLoad`
declared, and to a limited lifetime. Presenting it for a different `id` is
refused as though it were absent.

A request carrying a valid token skips the `castRole` check, since only
`castLoad` ever issues one, and skips the account bitrate ceiling — there is no
account to apply it to.
'''

  [[endpoint.param]]
  name  = "castController"
  type  = "string"
  doc   = 'The id given to `startCast`. Only the owner of a live cast session has its playback redirected to the receiver.'
  notes = '''
While a cast session is live, a request from the client that **owns** it is
answered `204` and the track is sent to the Chromecast instead, so that client
does not play it a second time itself. Every other caller — a client that sent
no `castController`, one whose id does not match, or a different account — is
served the stream normally.

Without this the redirect was global: any request in the server was answered
`204` while anyone was casting, so starting a track on a phone played it on
whatever receiver a browser had picked earlier.
'''

  [[endpoint.param]]
  name  = "size"
  type  = "string"
  doc   = 'Video only. A cap on the output frame size, as `WxH` — `640x480`.'
  notes = '''
Any value here disqualifies the direct and remux tiers, so the video is
re-encoded on the fly and the response is chunked with no `Content-Length`.

Strictly `WxH`, both between 16 and 7680/4320. Anything else is ignored rather
than rejected, and means "do not scale" — the same as omitting it.
'''

  [[endpoint.param]]
  name = "duration"
  type = "int"
  doc  = 'Video only. Bound the output to this many seconds from `timeOffset`, and switch the container to MPEG-TS. That is one HLS segment.'

[[endpoint]]
kind       = 'additions'
applies_to = ["hls.m3u8"]
section    = "playback"
path       = "/rest/hls.m3u8"
summary    = 'A frame size may ride along with the variant bitrate.'
notes      = '''
Note the path: this is the one endpoint not spelled `<name>.view`.

The playlist is stateless — it is arithmetic over the stored duration, and
every segment is an ordinary `stream` request bounded by `timeOffset` and
`duration`. Nothing is written to disk and nothing needs cleaning up if a
client stops mid-playlist.
'''

  [[endpoint.param]]
  name = "bitRate"
  type = "string"
  doc  = 'May carry an `@WxH` suffix naming the frame size for that variant — `1000@640x480`.'


# ===========================================================================
# Video
# ===========================================================================

[[endpoint]]
kind       = 'additions'
applies_to = ["getAlbum", "getMusicDirectory", "getVideos", "getSong"]
section    = "video"
summary    = 'Two fields on a video entry, from the four endpoints that populate them.'
notes      = '''
NOTE: Only these four queries select the underlying columns. A video reached
through `getStarred`, `getPlaylist`, `getPlayQueue`, `getBookmarks` or
`search` reports neither field. That is the safe direction — it plays
correctly and seeks by re-request — but such a video re-encodes on every seek
even when it could have been remuxed.
'''

  [[endpoint.field]]
  name  = "nativeSeek"
  type  = "bool"
  on    = "Child"
  doc   = 'Whether the stream this entry would produce carries a `Content-Length` and answers `Range` requests.'
  notes = '''
A client can let its media element seek by itself instead of re-requesting
with `timeOffset`.

It is **not** the same question as "will ffmpeg run": the remux tier runs
ffmpeg but writes a real file, so it seeks as well as an untouched original.
Only a re-encode is unseekable. `transcodedSuffix` cannot be used for this —
it is present for both the remux and re-encode tiers, which differ precisely
here.

A client that sends `timeOffset` for a remuxable file demotes it from a
`-c copy` remux to a full re-encode.
'''

  [[endpoint.field]]
  name  = "season"
  type  = "int"
  on    = "Child"
  doc   = 'The season an episode belongs to; present only when the entry is one.'
  notes = '''
`discNumber` already carries the same number — that is the field every
Subsonic client groups and sorts by, and none of them knows what a season is —
so a client that ignores `season` groups a series correctly and simply calls
the groups discs. A client that reads it can head them "Series 2" instead.

The number comes from an `S02E03`-style marker or from a folder naming its
season. A `Disc 2` or `CD1` folder is deliberately not one, and neither is an
unnumbered `Specials` folder, so both of those keep reporting a disc.
'''

[[endpoint]]
kind       = 'additions'
applies_to = ["getCaptions"]
section    = "video"
summary    = 'A Chromecast fetches its own subtitle track and has no credentials.'

  [[endpoint.param]]
  name  = "castToken"
  type  = "string"
  doc   = 'The token minted by `castLoad`, accepted in place of credentials.'
  notes = '''
Scoped as it is on `stream`, and additionally to the caption ids the LOAD
declared: a track that LOAD did not offer is one the receiver has no reason to
ask for, so the token does not authorise it.

The converted result is cached, because ffmpeg has to demux the whole
container to collect one subtitle stream and the receiver fetches the track
the moment it is switched on.
'''


# ===========================================================================
# Album text and images
# ===========================================================================

[[endpoint]]
kind     = 'endpoint'
name     = "getAlbumTexts"
section  = "albumtext"
response = 'subsonic-json'
summary  = 'Lists the `.txt` files in an album folder, sorted by name.'
notes    = '''
Utility files that are not human-readable notes — currently
`fingerprints.txt` — are excluded.
'''

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'Album folder id.'

  [[endpoint.field]]
  name = "albumTexts.textFile.name"
  type = "string"
  doc  = 'Filename, to be handed back to `getAlbumText`.'

[[endpoint]]
kind         = 'endpoint'
name         = "getAlbumText"
section      = "albumtext"
response     = 'raw'
content_type = "text/plain; charset=utf-8"
summary      = 'Serves one of those files. The response is the file itself, not a Subsonic envelope.'

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'Album folder id.'

  [[endpoint.param]]
  name     = "name"
  type     = "string"
  required = true
  doc      = 'Filename from `getAlbumTexts`. Must end in `.txt` and may not contain `/`, `\` or `..`.'

  [[endpoint.error]]
  http = '400'
  when = 'The name fails either rule above.'

[[endpoint]]
kind     = 'endpoint'
name     = "getAlbumImages"
section  = "albumtext"
response = 'subsonic-json'
summary  = 'How many images an album folder holds — the cover plus any extras.'
notes    = '''
Use it to drive the `index` parameter of `getCoverArt`.
'''

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'Album folder id.'

  [[endpoint.field]]
  name = "albumImages.count"
  type = "int"
  doc  = 'Total image count, so valid `index` values are 0 to count-1.'

[[endpoint]]
kind    = 'endpoint'
name      = "setCoverArt"
section   = "albumtext"
method    = 'POST'
auth_note = 'Your own upload batch, or admin anywhere.'
summary   = 'Writes `cover.jpg` or `cover.png` into an album folder, whichever the uploaded bytes actually are.'
notes     = '''
Supply exactly one of `file` or `url`.

A `url` must be `http` or `https` and must resolve to a globally routable
address. Loopback, link-local, RFC1918 and other private ranges are refused,
and a redirect into one is refused at the hop that names it — the server is
reachable from places the caller is not, and an image fetch is not a reason to
lend it out. The refusal is deliberately worded the same as a fetch that
simply failed, so the endpoint cannot be used to tell one host or port from
another. The response body is also size-capped.

**JPEG and PNG only** — the format is taken from the magic bytes, not from the
declared content type, and anything else is rejected. That is not a new
restriction so much as the removal of a trap: the scanner indexes only
`.jpg`, `.jpeg` and `.png`, so a WebP written as `cover.jpg` used to become a
cover nothing could decode.

If the upload changes the format, the file it replaces is removed, since
`cover.jpg` outranks `cover.png` when the scanner looks for a cover.

A cover set this way is marked as chosen by a person and is never overwritten
by a scan — which for a film is the only way to correct a wrong TMDB match.
'''
see = ["getAlbumImages"]

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'Album folder id. Required in both cases.'

  [[endpoint.param]]
  name = "file"
  type = "multipart"
  doc  = 'A multipart part whose content type must begin with `image/`.'

  [[endpoint.param]]
  name = "url"
  type = "string"
  doc  = 'An `http://` or `https://` URL, fetched server-side; the response must have an `image/` content type.'


# ===========================================================================
# Metadata editing
# ===========================================================================

[[endpoint]]
kind    = 'endpoint'
name      = "updateSong"
section   = "metadata"
auth_note = 'Your own upload batch, or admin anywhere.'
summary   = 'Updates the tags of a single track.'
notes     = '''
For an **audio** track the file is authoritative. Tags are written to it first
via TagLib and mirrored into the database only if that succeeds, so a failed
write leaves both in their original state.

For a **video** the edit is recorded in the server's user database instead, and
re-applied over the scanned values on every scan. No tag is written, for any
container: the scanner reads a video's title, year and episode number from its
filename and never opens it with TagLib, so a tag would be a second copy of a
fact that nothing reads. This applies to `.mp4` as much as to `.mkv`, even
though TagLib could write the first of those.

NOTE: The practical difference is that a video edit survives a rebuild of the
music library database while remaining invisible to other tools, whereas an
audio edit travels with the file itself. Renaming the file is still the way to
change a video's title such that another program will see it.
'''

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'Song id.'

  [[endpoint.param]]
  name = "title"
  type = "string"
  doc  = 'Omitted fields are left untouched.'

  [[endpoint.param]]
  name = "track"
  type = "int"
  doc  = 'Track number.'

  [[endpoint.param]]
  name = "year"
  type = "int"
  doc  = 'Year.'

  [[endpoint.param]]
  name = "disc"
  type = "int"
  doc  = "Disc number, written through TagLib's `PropertyMap` as `DISCNUMBER` since the generic tag API has no disc setter."

[[endpoint]]
kind      = 'endpoint'
name      = "moveAlbum"
section   = "metadata"
auth_note = 'Your own upload batch, or admin anywhere.'
summary   = 'Puts an album somewhere, under a name, by moving the directory on disk.'
notes     = '''
Every parameter but `id` is optional and every omitted one means *unchanged*,
so this one endpoint covers renaming an album in place, re-filing it under a
different artist, moving it between library roots, and promoting an upload
into the shared library. It replaces `renameAlbum` and `promoteAlbum`, which
were the same operation described two ways.

**Where it lands** is the one rule worth reading:

* **`musicFolderId` given** — the album goes to `<that root>/<folder>/<album>`,
  exactly two levels under the root. Both library layouts are `L1/L2/[L3]/
  files`, L2 is the album being moved, and L3 is only ever a disc or season
  directory inside it.
* **`musicFolderId` omitted** — everything above the artist level is left
  alone: the library root, and for an upload the owner and the batch id. The
  album goes to `<all of that>/<folder>/<album>`.

So a plain rename sends `album`; a re-file sends `folder`; a promote sends
`musicFolderId` and `folder`; and moving a film out of the music root and
under a `categories` one sends all three.

Artist and album names are directory names — the scanner never reads them from
tags — so this is the only way to correct them, and it is necessarily a
filesystem move.

It re-files **only the album it is given**: changing `folder` moves that one
album and leaves the artist's other albums alone. A whole-artist rename is
deliberately not offered — an album edit screen silently rewriting other
albums is too easy to do by accident.

The directory move happens first and is the authoritative act; the database
rows are then repaired to carry the new paths, so stars, play counts, playlist
entries, the queue and bookmarks all survive. Tags are rewritten afterwards
and a file TagLib will not write is counted in `tagFailures` rather than
failing the call — the opposite order to `updateSong`, where the database
mirrors the tag rather than the directory.

NOTE: **The artist tag is only rewritten under an `artists` root.** Under a
`categories` root the level is a category — Film, Series — and writing that
into an artist tag would stamp "Film" across every file of a promoted
documentary. The album tag is rewritten whenever `album` changes.

NOTE: **An artist tag naming somebody other than the old folder is left
alone.** Only a tag that already held the old folder's name is rewritten,
because anything else is a real credit — every track of a compilation has
one — and overwriting it would report the whole album as by one artist ever
after. The comparison ignores case and punctuation, the same rule that decides
a song entry's `artist`.

An emptied source directory is removed, so it does not linger in the listing
reading "0 albums", and an upload's batch directory goes with it.
'''
see = ["updateSong", "deleteUpload"]

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'Album folder id.'

  [[endpoint.param]]
  name  = "musicFolderId"
  type  = "string"
  doc   = 'The destination root, as `getMusicFolders` reports it. Omitted keeps the album where it is.'
  notes = '''
Error 70 if it names anything that is not a browsable library root —
including the uploads root, which that listing excludes and which is never a
destination.

Naming a root requires admin, since it is what puts something into the shared
library.
'''

  [[endpoint.param]]
  name  = "folder"
  type  = "string"
  doc   = 'The level under the root: an artist under an `artists` root, a category under a `categories` one. A name not already present is created, so there is no separate operation for adding an artist or a category.'
  notes = '''
**Required when `musicFolderId` is given**, and omitted keeps the current one
otherwise. It was briefly allowed to default when promoting and the default
was a guess that filed things wrongly: it used the batch's own artist name,
which for a fetched video is the channel that published it and never a
category. A caller that does not know where something belongs should be made
to decide rather than have it decided badly for them.
'''

  [[endpoint.param]]
  name = "album"
  type = "string"
  doc  = 'New album name. Omitted keeps the current one.'

  [[endpoint.field]]
  name = "movedAlbum.id"
  type = "string"
  doc  = 'The album folder id afterwards. Usually unchanged, but a move into a directory that did not exist yet mints one.'

  [[endpoint.field]]
  name = "movedAlbum.parent"
  type = "string"
  doc  = 'The artist or category folder id afterwards.'

  [[endpoint.field]]
  name = "movedAlbum.album"
  type = "string"
  doc  = 'The album name as it was applied, after sanitising.'

  [[endpoint.field]]
  name = "movedAlbum.artist"
  type = "string"
  doc  = 'The folder name as it was applied, after sanitising.'

  [[endpoint.field]]
  name  = "movedAlbum.tagFailures"
  type  = "int"
  doc   = 'How many files could not have their tags rewritten. The move still happened.'
  notes = '''
Zero when no tag needed changing — a move that alters neither name opens no
files at all.
'''

  [[endpoint.error]]
  code = '10'
  when = '`id` missing or not a number; `folder` missing while `musicFolderId` is given; a supplied name holding nothing usable once sanitised.'

  [[endpoint.error]]
  code = '50'
  when = 'Naming a destination root without admin, or moving anything that is not your own upload batch without admin.'

  [[endpoint.error]]
  code = '70'
  when = 'No album with that id, or `musicFolderId` does not name a browsable library root.'

  [[endpoint.error]]
  code = '0'
  when = 'The album is its own artist and no destination root was named, something with that name is already in the destination, or the target falls outside every configured root.'


[[endpoint]]
kind     = 'endpoint'
name     = "getServerSettings"
section  = "settings"
auth     = 'admin'
response = 'subsonic-json'
summary  = 'Returns the third-party API credentials the server holds.'

  [[endpoint.field]]
  name = "serverSettings.discogsToken"
  type = "string"
  doc  = 'Discogs personal access token, used in the artist-portrait chain. Empty when unset.'

  [[endpoint.field]]
  name = "serverSettings.tmdbKey"
  type = "string"
  doc  = 'TMDB API key, used to identify films and series during the scan. Empty when unset.'

  [[endpoint.error]]
  code = '50'
  when = 'The caller is not an admin.'

[[endpoint]]
kind    = 'endpoint'
name    = "saveServerSettings"
section = "settings"
auth    = 'admin'
summary = 'Sets one or both of those credentials.'
notes   = '''
**Only the settings the caller actually sent are written**, so omitting one
preserves it. With a single field that distinction did not exist; with two, a
client saving just one of them would otherwise blank the other.

Send an empty value to clear a setting.
'''

  [[endpoint.param]]
  name = "discogsToken"
  type = "string"
  doc  = 'New Discogs token. Omit to leave unchanged.'

  [[endpoint.param]]
  name = "tmdbKey"
  type = "string"
  doc  = 'New TMDB key. Omit to leave unchanged. Re-read at the top of every scan.'

  [[endpoint.error]]
  code = '50'
  when = 'The caller is not an admin.'


# ===========================================================================
# Users
# ===========================================================================

[[endpoint]]
kind       = 'additions'
applies_to = ["getUser", "getUsers", "createUser", "updateUser"]
section    = "users"
summary    = 'One role Subsonic does not define.'
notes      = '''
Roles gaindrive does not implement are still reported, with fixed values, so
that clients expecting them do not break. That behaviour is standard-shaped
and documented with the endpoints themselves.
'''

  [[endpoint.field]]
  name = "castRole"
  type = "bool"
  on   = "user"
  doc  = 'Whether the account may use the cast endpoints. New accounts default to false.'

  [[endpoint.param]]
  name  = "castRole"
  type  = "bool"
  doc   = 'On `createUser` and `updateUser`, the literal string `true` enables; anything else means false.'
  notes = '''
On `updateUser`, as with every other field there, omitting the parameter keeps
the account's existing value.
'''


# ===========================================================================
# Upload
# ===========================================================================

[[endpoint]]
kind     = 'endpoint'
name     = "upload"
section  = "upload"
method   = 'POST'
path     = "/upload"
auth     = 'uploadRole'
response = 'plain-json'
summary  = "Uploads an archive of audio or video into the calling account's personal area."
notes    = '''
Note the path: this is **not** under `/rest/`, and it answers with a bare
`{"status": ..., "message": ...}` object rather than a Subsonic envelope. A
refusal arrives as `{"status": "error", ...}` with HTTP 400, not as a Subsonic
error code.

With no uploads root configured the endpoint refuses rather than writing into
a library root.
'''
see = ["fetchUrl", "moveAlbum", "deleteUpload"]

  [[endpoint.param]]
  name     = "file"
  type     = "multipart"
  required = true
  doc      = 'A multipart part named `file`, with a `.zip`, `.tar`, `.tar.gz` or `.tgz` filename.'

  [[endpoint.param]]
  name = "artist"
  type = "string"
  doc  = "Files the batch under this name instead of whatever the archive's own folders and the files' tags say."

  [[endpoint.param]]
  name = "album"
  type = "string"
  doc  = 'The same for the level below.'

  [[endpoint.field]]
  name = "status"
  type = "string"
  doc  = '`ok` or `error`.'

  [[endpoint.field]]
  name = "files"
  type = "int"
  doc  = 'How many media files the archive yielded.'

  [[endpoint.field]]
  name = "batch"
  type = "string"
  doc  = 'The batch id the upload landed in.'

  [[endpoint.error]]
  http = '400'
  when = 'No uploads root, an unsupported archive type, or a supplied name holding nothing usable once sanitised.'

[[endpoint]]
kind    = 'endpoint'
name    = "deleteUpload"
section = "upload"
auth    = 'uploadRole'
summary = 'Removes an uploaded album, files and all. Irreversible — there is no trash behind it.'
notes   = '''
The id must resolve to a path of exactly the shape
`<uploads root>/<owner>/<batch>/<artist>/<album>`, and the owner must be the
calling account **unless the caller is an admin**.

**That shape check is the security boundary**, not a validation nicety —
without it this is "delete the folder with this id", which is "delete any
folder on the server", reachable by any account with upload rights guessing
integers. One message covers both "not an upload" and "not yours", since
telling them apart is only useful to somebody probing ids.

An admin may delete anybody's because an admin is who approves them: with
`personal=*` they can see everyone's, and being able to see junk without being
able to clear it would leave them asking its owner to do it.

It tidies upwards. An artist directory left empty by the deletion is removed
too, or it would remain in the listing as an artist showing no albums; the
batch directory goes after it. Stars, play counts, playlist entries, the queue
and bookmarks naming the deleted files are deleted with them — those live in
the client database, which no scan has ever touched.
'''

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'Album folder id.'

  [[endpoint.error]]
  code = '0'
  when = 'Not an upload, or not yours — "Item is not in your uploads."'


# ===========================================================================
# Fetching from a URL
# ===========================================================================

[[endpoint]]
kind    = 'endpoint'
name    = "getUrlHandlers"
section = "urlfetch"
auth    = 'uploadRole'
summary = 'What this server can fetch.'
notes   = '''
An empty list means the feature is unavailable, either because no handlers are
configured or because the tool they name is not installed; a client should
then not offer the option at all.

The pattern and the command line are deliberately not reported — a handler's
argv can carry cookies, a proxy credential or an API key.
'''

  [[endpoint.field]]
  name = "urlHandlers.urlHandler.name"
  type = "string"
  doc  = 'A label for the handler, for showing the user what is supported.'

  [[endpoint.field]]
  name = "urlHandlers.urlHandler.audio"
  type = "bool"
  doc  = 'Whether this handler can fetch in `audio` mode.'

  [[endpoint.field]]
  name = "urlHandlers.urlHandler.video"
  type = "bool"
  doc  = 'Likewise for `video`.'

[[endpoint]]
kind    = 'endpoint'
name    = "fetchUrl"
section = "urlfetch"
auth    = 'uploadRole'
summary = 'Queue a fetch. Returns immediately with a job id; the work happens in the background.'
notes   = '''
The names are applied by renaming the batch's two directory levels after the
tool exits and before the library scan, so they cost nothing and can never be
seen half-applied. Three consequences are worth stating because none of them
is guessable:

* Where a fetch produced several directories at a level — a playlist, or a
  handler that splits by uploader — they are **merged** into the one name
  given, and files that then collide are suffixed rather than overwritten.
* Giving only `artist` keeps the handler's album names; giving only `album`
  applies that name inside *every* artist directory.
* A third directory level, if the handler wrote one, is left alone. That is a
  disc directory to the scanner, and renaming it would fuse two discs.

Note also that the duplicate guard keys on the URL alone, so the same URL
cannot be fetched twice under two different names while one is in flight.
'''
see = ["getUrlHandlers", "getFetchJobs", "cancelFetch"]

  [[endpoint.param]]
  name     = "url"
  type     = "string"
  required = true
  doc      = 'The URL to fetch.'
  notes    = '''
It travels as a query parameter, so it is subject to the server's request-line
length limit of about 8 kB.
'''

  [[endpoint.param]]
  name    = "mode"
  type    = "string"
  values  = ["audio", "video"]
  default = 'audio'
  doc     = 'Which one a handler supports is what `getUrlHandlers` reports.'

  [[endpoint.param]]
  name = "artist"
  type = "string"
  doc  = "The artist directory the batch is filed under, replacing whatever the handler would have chosen. Absent or blank keeps the handler's own choice."

  [[endpoint.param]]
  name = "album"
  type = "string"
  doc  = 'Likewise for the album directory.'

  [[endpoint.field]]
  name = "fetchJob.id"
  type = "string"
  doc  = 'The job id, for `getFetchJobs` and `cancelFetch`.'

  [[endpoint.field]]
  name = "fetchJob.batch"
  type = "string"
  doc  = 'The batch directory the fetch will write into, in stored form.'

  [[endpoint.field]]
  name = "fetchJob.handler"
  type = "string"
  doc  = 'Which handler matched the URL.'

  [[endpoint.field]]
  name = "fetchJob.mode"
  type = "string"
  doc  = '`audio` or `video`, as requested.'

  [[endpoint.field]]
  name = "fetchJob.artist"
  type = "string"
  doc  = 'The name that will be applied, or empty.'

  [[endpoint.field]]
  name = "fetchJob.album"
  type = "string"
  doc  = 'Likewise.'

  [[endpoint.field]]
  name = "fetchJob.state"
  type = "string"
  doc  = 'One of `queued`, `running`, `scanning`, `done`, `error`, `cancelled`.'

  [[endpoint.error]]
  code = '10'
  when = '`url` missing, or `artist` or `album` given but containing nothing usable as a directory name.'

  [[endpoint.error]]
  code = '0'
  when = 'No uploads root; the scheme is not http(s); no handler matches; the matched handler cannot do the requested mode; the same URL is already being fetched for this user; or the queue is full.'

[[endpoint]]
kind    = 'endpoint'
name    = "getFetchJobs"
section = "urlfetch"
auth    = 'uploadRole'
summary = "The calling user's own jobs, newest first."
notes   = '''
Admins see their own and nobody else's: this is a progress display, not an
audit log.

Finished jobs are kept for fifteen minutes, or the last ten per user.
'''

  [[endpoint.field]]
  name = "fetchJobs.fetchJob"
  type = "object[]"
  doc  = 'Everything `fetchUrl` returns, plus the fields below.'

  [[endpoint.field]]
  name = "url"
  type = "string"
  on   = "fetchJob"
  doc  = 'The URL as submitted.'

  [[endpoint.field]]
  name = "percent"
  type = "int"
  on   = "fetchJob"
  doc  = "Progress, parsed from the tool's output. A line carrying no percentage keeps the previous value rather than resetting to zero."

  [[endpoint.field]]
  name  = "detail"
  type  = "string"
  on    = "fetchJob"
  doc   = "The tool's last output line."
  notes = '''
Paths in it are rewritten to their stored form — a root path is never
surfaced in an API response.
'''

  [[endpoint.field]]
  name = "error"
  type = "string"
  on   = "fetchJob"
  doc  = 'Why the job failed, when its state is `error`.'

  [[endpoint.field]]
  name = "files"
  type = "int"
  on   = "fetchJob"
  doc  = 'How many media files the fetch produced.'

  [[endpoint.field]]
  name = "started"
  type = "string"
  on   = "fetchJob"
  doc  = 'When the job began.'

  [[endpoint.field]]
  name = "finished"
  type = "string"
  on   = "fetchJob"
  doc  = 'When it ended, if it has.'

[[endpoint]]
kind    = 'endpoint'
name    = "cancelFetch"
section = "urlfetch"
auth    = 'uploadRole'
summary = 'Stop a queued or running fetch and delete its batch.'

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'The job id.'

  [[endpoint.error]]
  code = '10'
  when = '`id` missing.'

  [[endpoint.error]]
  code = '70'
  when = 'No such job belongs to the caller.'


# ===========================================================================
# Chromecast
# ===========================================================================

[[endpoint]]
kind    = 'endpoint'
name    = "listCastDevices"
section = "cast"
auth    = 'castRole'
summary = 'Chromecast devices on the LAN: those discovered over mDNS, plus any named in the server configuration.'
notes   = '''
Discovery assembles a device only from records belonging to
`_googlecast._tcp`, and returns one entry per Cast id, so a device announcing
several services or several spellings of its name still appears once.

A configured device whose address and port were also discovered appears once,
as the discovered one, since that carries the device's own name and Cast id.
The port belongs in that comparison because a Cast multizone group lives at
its leader's address on a different one.

Configured devices exist because discovery can fail for reasons no client can
fix — a device that answers TLS on 8009 while its mDNS responder has stopped
replying even to a direct unicast query. The address must be an IP literal; a
hostname is refused at startup.
'''

  [[endpoint.field]]
  name = "castDevices.castDevice.id"
  type = "string"
  doc  = 'Hand this to `startCast`. For a configured device it is `manual:<address>:<port>`, derived rather than random so it survives a server restart.'

  [[endpoint.field]]
  name = "castDevices.castDevice.name"
  type = "string"
  doc  = "The device's friendly name, from its `fn` record. A device sending none is named by its instance label, so a row is never labelled by its IP."

  [[endpoint.field]]
  name = "castDevices.castDevice.model"
  type = "string"
  doc  = "The device's own model string, from its `md` record. Empty for a configured device, which has no announcement to read."

  [[endpoint.field]]
  name = "castDevices.castDevice.address"
  type = "string"
  doc  = 'IP address.'

  [[endpoint.field]]
  name = "castDevices.castDevice.port"
  type = "int"
  doc  = 'Usually 8009; a multizone group gets a dynamic one.'

  [[endpoint.field]]
  name = "castDevices.castDevice.manual"
  type = "bool"
  doc  = 'True for a configured device.'

  [[endpoint.field]]
  name = "castDevices.castDevice.videoOut"
  type = "bool"
  doc  = 'Whether the device can display a picture, from bit 0 of its `ca` record. True when it announced nothing, which is every configured device: refusing the picture on a guess is worse than the guess. `castLoad` sends a video to a device with this false as its soundtrack alone.'

[[endpoint]]
kind    = 'endpoint'
name    = "startCast"
section = "cast"
auth    = 'castRole'
summary = 'Activates cast mode, targeting one device.'
notes   = '''
This is where the session's owner is recorded: the authenticated account
together with `castController`.

While the session is active, `stream` answers HTTP 204 to that owner and sends
the track to the Chromecast instead, so the owner does not end up playing it
twice. Every other caller is served the stream normally.

Only one session exists at a time. Calling this while another owner holds one
takes it over: that receiver is stopped and the previous owner's `castEvents`
stream is dropped, which is how its UI learns to leave cast mode. It is also
the way back in for a client that has lost the id it started the session with.
'''
see = ["stopCast", "castLoad"]

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'Device id from `listCastDevices`.'

  [[endpoint.param]]
  name     = "castController"
  type     = "string"
  required = true
  doc      = 'An opaque id identifying this client instance, which together with the account becomes the owner of the session. Make one up once and keep it — the web client stores eight random bytes in `localStorage`, so it survives a page reload.'
  notes    = '''
Required, and deliberately without a fallback to `c=`. A client asking the
server to drive a Chromecast already speaks this extension, so it can be asked
to name itself, and refusing the nameless case is what guarantees a caller that
sends no id can never own a session — and so can never be confused with another
that also sent none.

It is not a credential. It authorises nothing and only distinguishes one
account's devices from each other.
'''

  [[endpoint.error]]
  code = '10'
  when = 'No `castController` was given.'

  [[endpoint.error]]
  code = '70'
  when = 'No device with that id.'

[[endpoint]]
kind    = 'endpoint'
name    = "stopCast"
section = "cast"
auth    = 'castRole'
summary = 'Deactivates cast mode and stops playback on the device.'
notes   = '''
Only the session's owner stops anything. A caller that does not match still
gets a success response, deliberately: a client displaced by a takeover runs
its own cleanup, and that must neither stop the session that replaced it nor
raise an error about a session it no longer has.
'''

  [[endpoint.param]]
  name = "castController"
  type = "string"
  doc  = 'The id given to `startCast`. Without a match this caller is treated as having no session.'

[[endpoint]]
kind    = 'endpoint'
name    = "castLoad"
section = "cast"
auth    = 'castRole'
summary = 'Tells the Chromecast to fetch and play a track.'
notes   = '''
**Seeking is also a `castLoad`**, not a `castControl` with `action=seek` —
every seek is a full reload. The server returns as soon as the load is queued;
the actual Cast message goes out on a background connection.

Subtitle tracks are declared to the receiver in **every** load, whether or not
one is switched on, because `castControl` with `action=captions` can only
activate a track the load already declared. Emitting them only when a caption
is already chosen works when the viewer picks before playing and never when
they pick during, which reads as an intermittent fault rather than a missing
feature.

**A video loaded onto a receiver that cannot display one is sent as its
soundtrack**, and the reply says so in `castLoad.audioOnly`. Which receivers
those are is bit 0 of the `ca` record `listCastDevices` reports as `videoOut`.
The decision is made here rather than by the client, so that a client draws
what happened instead of deciding it a second time from the device list — and
no subtitle tracks are declared for such a load, there being no picture to put
them on.

Such a load takes noticeably longer to begin: the soundtrack is transcoded in
full before the receiver is told anything, because a receiver abandons a
session after about a minute with no data on the HTTP body and a feature-length
film takes longer than that to convert.
'''
# `see` may only name endpoints defined in this file, so that a typo is caught
# rather than silently dropping a cross-reference; getVideoInfo is standard and
# is named in the prose above instead.
see = ["castControl", "castSession"]

  [[endpoint.param]]
  name     = "id"
  type     = "string"
  required = true
  doc      = 'Song id.'

  [[endpoint.param]]
  name = "timeOffset"
  type = "float"
  doc  = 'Seek position in seconds, sent to the receiver as `currentTime`.'

  [[endpoint.param]]
  name    = "trackId"
  type    = "int"
  default = '0'
  doc     = 'Subtitle track to start with, numbered from 1 in the order `getVideoInfo` lists captions. 0 or absent means none.'
  notes   = '''
`trackId`, not `captionId`: the cast API numbers tracks 1..n by position, and
0 means off. `captionId` cannot express "off" — the sidecar caption index and
a missing parameter are both -1, so "no subtitles" and "the sidecar file"
would be one value.
'''


  [[endpoint.param]]
  name = "castController"
  type = "string"
  doc  = 'The id given to `startCast`. Without a match this caller is treated as having no session.'

  [[endpoint.field]]
  name = "castLoad.audioOnly"
  type = "bool"
  doc  = "True when the receiver was sent the video's soundtrack rather than the video, because it announced no `videoOut`. Always false for an audio track."

  [[endpoint.error]]
  code = '0'
  when = 'No cast session is active, or the caller does not own it.'

[[endpoint]]
kind    = 'endpoint'
name    = "castControl"
section = "cast"
auth    = 'castRole'
summary = 'Transport control for the active session.'

  [[endpoint.param]]
  name     = "action"
  type     = "string"
  required = true
  values   = ["play", "pause", "seek", "captions"]
  doc      = 'What to do.'
  notes    = '''
* `play` resumes a paused session. If the session has gone `IDLE` — the
  receiver times out during long pauses — this instead re-issues a full load
  from the last known position.
* `seek` is only for in-session seeks; the web client seeks via `castLoad`,
  which is a full reload.
* `captions` silently does nothing when the receiver has no media session yet.
  The track belongs on the `castLoad` in that case.
'''

  [[endpoint.param]]
  name = "time"
  type = "float"
  doc  = 'Seconds, for `action=seek`.'

  [[endpoint.param]]
  name = "trackId"
  type = "int"
  doc  = 'For `action=captions`, numbered as for `castLoad`. 0 or absent turns subtitles off.'

  [[endpoint.param]]
  name = "castController"
  type = "string"
  doc  = 'The id given to `startCast`. Without a match this caller is treated as having no session.'

  [[endpoint.error]]
  code = '0'
  when = 'No cast session is active, or the caller does not own it.'

[[endpoint]]
kind     = 'endpoint'
name     = "castSession"
section  = "cast"
auth     = 'castRole'
response = 'subsonic-json'
summary  = 'A non-blocking snapshot of the current session, for restoring the UI after a page reload.'
notes    = '''
Only the caller's own session. Another owner's is reported as
`active: false` — otherwise a second browser would adopt it wholesale on page
load and show itself as casting.
'''

  [[endpoint.param]]
  name = "castController"
  type = "string"
  doc  = 'The id given to `startCast`. Without a match this caller is treated as having no session.'

  [[endpoint.field]]
  name = "castSession.active"
  type = "bool"
  doc  = 'Whether a session exists **for this caller**. The remaining fields are present only when it does.'

  [[endpoint.field]]
  name = "castSession.deviceId"
  type = "string"
  doc  = 'The device being cast to, as `listCastDevices` reports it.'

  [[endpoint.field]]
  name = "castSession.deviceName"
  type = "string"
  doc  = 'Its friendly name.'

  [[endpoint.field]]
  name = "castSession.songId"
  type = "string"
  doc  = 'What is loaded.'

  [[endpoint.field]]
  name = "castSession.startOffset"
  type = "float"
  doc  = "Add this to the receiver's reported `currentTime` to get the absolute position in the track. Zero under native seek, which is every codec today."

  [[endpoint.field]]
  name = "castSession.playerState"
  type = "string"
  doc  = 'As the receiver reports it: `PLAYING`, `PAUSED`, `BUFFERING`, `IDLE`.'

  [[endpoint.field]]
  name = "castSession.currentTime"
  type = "float"
  doc  = "The receiver's reported position."

  [[endpoint.field]]
  name = "castSession.duration"
  type = "float"
  doc  = 'Duration as the receiver understands it.'

  [[endpoint.field]]
  name = "castSession.songDuration"
  type = "float"
  doc  = 'Duration as the library has it, which is the one to trust for a progress bar.'

  [[endpoint.field]]
  name = "castSession.trackId"
  type = "int"
  doc  = 'The subtitle track currently showing, or 0.'

  [[endpoint.field]]
  name = "castSession.audioOnly"
  type = "bool"
  doc  = 'The same answer `castLoad` returned for the load now playing. Present here because a client that has just reloaded has no `castLoad` reply to have read it from.'

[[endpoint]]
kind         = 'endpoint'
name         = "castEvents"
section      = "cast"
auth         = 'castRole'
response     = 'sse'
content_type = "text/event-stream"
summary      = "Server-sent events carrying the receiver's status as it changes."
notes        = '''
An event is emitted whenever the receiver pushes a status change, and at least
every 15 seconds otherwise. Each `data:` payload is a JSON object with
`playerState`, `currentTime`, `duration`, `idleReason` and `startOffset`.

NOTE: The SSE connection doubles as the liveness signal for the cast session.
Once the last listener disconnects, casting is torn down automatically after
30 seconds — so a client that wants the session to survive must keep this open.

NOTE: The stream also ends when another client takes the session over. A client
should treat that as having left cast mode rather than as a transport error —
the retry is answered 204, so `EventSource` reaches `CLOSED` and stops.
'''
see = ["castSession"]

  [[endpoint.param]]
  name = "castController"
  type = "string"
  doc  = 'The id given to `startCast`. Without a match this caller is treated as having no session.'

  [[endpoint.error]]
  http = '204'
  when = 'No cast session is active, or the caller does not own it. There is nothing to stream, so no event stream is opened.'
