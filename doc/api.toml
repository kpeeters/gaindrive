# The gaindrive API extensions — the single source of truth.
#
# Everything gaindrive adds to the Subsonic/OpenSubsonic surface is written
# here and nowhere else, in the same sense that VERSION is the only place the
# version is written.  html/api.html is generated from this file by
# doc/gen_api_html.py; never edit that page.  API.md documents the standard
# endpoints and points here for the rest.
#
# Regenerate with:   make api-html
#
# ---------------------------------------------------------------------------
# Two rules that are not style preferences:
#
#  * Prose uses TOML *literal* strings — '...' and '''...'''.  A basic
#    (double-quoted) string processes backslash escapes and a lone \ is a
#    parse error, and some of the prose below contains one verbatim.  Double
#    quotes are for identifiers, which never contain a backslash.
#
#  * Anything that gets printed is a string, numbers included: default = '50'.
#    Booleans appear only in `required` and `repeatable`, which are logic and
#    are never rendered, so Python's True cannot reach the page.
#
# ---------------------------------------------------------------------------
# The markdown subset accepted in `blurb`, `notes` and `doc`.  Nothing else is
# supported; the generator warns on stderr about a line that looks like it
# wanted something more.
#
#    blank line       paragraph break
#    * item           star list (a run of them becomes one list)
#    `code`           inline code
#    **bold**  *em*
#    [text](url)      link; http(s), #anchor or *.html only
#    NOTE: ...        a paragraph opening with this becomes a callout box
#
# ---------------------------------------------------------------------------
# Entry kinds:
#
#    kind = 'endpoint'    a gaindrive endpoint, documented in full.
#                         Requires `name`.  `version` is optional and defaults
#                         to '1'; set it only on an endpoint added by a later
#                         extension version, which is then the only one badged.
#    kind = 'additions'   a standard Subsonic endpoint that carries gaindrive
#                         parameters or fields.  Requires `applies_to`; only
#                         the additions are listed, never what the host
#                         endpoint does.  Everything under such an entry is an
#                         extension by construction.
#
# `applies_to` names hosts as text; a name matching an endpoint defined here
# is rendered as a link.

[meta]
extension = "gaindrive"
title     = "GainDrive API extensions"
intro     = '''
GainDrive speaks the [Subsonic](https://opensubsonic.netlify.app/) API, and
this page documents only what it *adds* to it: the endpoints Subsonic does not
define, and the extra parameters and response fields that standard endpoints
carry. The standard endpoints themselves behave as specified and are not
repeated here.

Everything is served at `/rest/<name>.view` unless stated otherwise, answers
in XML or in JSON (`f=json`), and requires authentication — either `u` and `p`
or the token scheme `u`, `t` and `s`. A parameter marked with a `*` is
required.

Clients discover this whole surface through `getOpenSubsonicExtensions`, which
advertises an extension named `gaindrive`.
'''


# ===========================================================================
# Sections.  File order is page order and sidebar order.
# ===========================================================================

[[section]]
id    = "extension"
title = "The gaindrive extension"
group = "Overview"
blurb = '''
`getOpenSubsonicExtensions` advertises an extension named `gaindrive` at
version 1. No authentication is needed for that call, so a client can negotiate
before login. Everything on this page is version 1.

Beside it the standard `transcodeOffset` is advertised, also at version 1. It
names behaviour rather than adding any — `stream` honours `timeOffset` for
audio, and always has — so nothing on this page depends on it.

A new *endpoint* will earn a new version, because a client cannot discover one
without being told. A new *optional parameter* on an endpoint an existing
version already names will not — a client that ignores it gets exactly what it
got before, so nothing it was told has been redefined.

A client that does not know the extension will not call any of these, so there
is no conformance risk in advertising it. Nothing in the standard endpoints
changes when the extension is present.
'''

