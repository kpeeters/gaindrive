[[section]]
id    = "chapters"
title = "Chapters"
group = "Library"
blurb = '''
A concert, a DJ set, a mixtape and a lecture recording are each one file
holding a dozen items, and chapter markers are what let a client say where
each one starts, jump between them and show which one is playing. Nothing
here is restricted to video: an audio file carries them for exactly the same
reason, and every endpoint below takes either.

Markers live in a **sidecar text file beside the media**,
`<stem>.chapters.txt` -- `Concert.chapters.txt` beside `Concert.mkv` -- in the
format `mp4chaps --export` writes, which means `mp4chaps --import` will move
them into the container for anyone who wants them there. The double extension
is deliberate: a plain `<stem>.txt` is indistinguishable from liner notes,
which `getAlbumTexts` lists, and that listing skips anything ending
`.chapters.txt` for the same reason.

gaindrive never writes markers *into* a container. MP4 chapters are a track
inside the file, so a save would be an `ffmpeg -c copy` rewrite of every byte
of a multi-gigabyte concert, needing that much free space as well as the time.
A container's own chapters are *read*, as a fallback, and only for video.

Nothing about a marker is durable in either database. The file on disk is the
only copy, so a rebuilt library still has them, a moved directory carries them
with it, and a sidecar written by hand or by another tool needs no API call to
take effect. What the databases do hold is an **index**, rebuilt by the scan
from those same files, and the split between the two is the thing to know
before building on any of this:

* `getChapters` reads the **file**, on every call. A playback lookup has to be
  right, and it is the only endpoint that can see a container's own markers.
* `getAlbumChapters` and the `search2`/`search3` additions read the **index**.
  A browse listing has to be cheap, and reading a sidecar per item -- or
  running `ffprobe` for a video without one -- every time somebody opens an
  album is exactly the cost the index removes.
* `saveChapters` writes the file and updates the index in the same call, so a
  save is visible everywhere before it returns. A sidecar changed *outside*
  gaindrive reaches `getChapters` at once and the other two only after the
  next scan of that folder.

NOTE: A chapter is not a song and has no id of its own. It cannot be streamed,
starred, queued or bookmarked; a client acts on one by streaming the song it
is inside and seeking to `start`. That is a decision rather than an omission,
and the reason is durability -- a synthetic id would have to encode a path,
and a folder rename would then orphan every star keyed on one.
'''

