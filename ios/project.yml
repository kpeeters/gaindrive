# The single source of truth for the Xcode project. GainDrive.xcodeproj is
# generated from this file and is not committed — see PLAN.md, "Project
# generation", for why.
#
# Run `make` after changing anything here.

name: GainDrive

options:
  bundleIdPrefix: org.gaindrive
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Empty directories in the package layout are placeholders for phases that
  # have not landed yet; they should not become groups in the project.
  generateEmptyDirectories: false
  groupSortPosition: top

# Machine-local settings, chiefly DEVELOPMENT_TEAM, which differs per developer
# and must not be committed. `make` writes the file if it is missing, so
# generate through the Makefile rather than calling xcodegen directly.
#
# Nothing below may set DEVELOPMENT_TEAM: a build setting written into the
# project overrides the xcconfig, which would silently defeat this.
#
# The version settings below rely on that same precedence in the opposite
# direction, deliberately. Do not "tidy" them into this xcconfig: they would be
# overridden by the project and silently stop tracking the VERSION file.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

# Xcodegen's default, stated so the config names the Makefile and the
# xcconfig above refer to are visible in one place.
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Warnings are cheap here and the alternative is discovering the same
    # things at review time.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
  # Uncomment to restore the stock translucent (Liquid Glass) pinned list
  # headers that `pinnedHeaderBackground()` (UI/Components/Rows.swift)
  # otherwise paints opaque; then run `make generate`. Per config rather than
  # in `base:` above, because a base-level SWIFT_ACTIVE_COMPILATION_CONDITIONS
  # replaces XcodeGen's config presets and would silently drop DEBUG from
  # Debug builds.
  # configs:
  #   Debug:
  #     SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG GD_GLASS_HEADERS
  #   Release:
  #     SWIFT_ACTIVE_COMPILATION_CONDITIONS: GD_GLASS_HEADERS

# Mac Catalyst, giving the "My Mac (Mac Catalyst)" destination from the same
# single target and the same sources. PLAN.md, "Mac Catalyst", records why this
# rather than a native macOS target: AVAudioSession, which the interruption and
# route-change handling is built on, does not exist on macOS.
#
# A group rather than a per-target block because **the test bundle needs the
# same settings as the app**. A test target that does not itself support
# Catalyst is simply not built for the destination, so `make test-mac` would
# report success having run nothing.
settingGroups:
  catalyst:
    SUPPORTS_MACCATALYST: YES
    # Mutually exclusive with the above in practice; kept explicit so enabling
    # it later is a decision rather than a default.
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    # The default (YES) would ship the Mac build as
    # `maccatalyst.org.gaindrive.ios`. One identifier across both is what
    # universal purchase expects, and it keeps `Bundle.main.bundleIdentifier`
    # the same constant everywhere — the tests assert on it and would otherwise
    # need a platform branch.
    DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    # The macOS contemporary of the iOS 18 floor, so an availability guard never
    # has to differ between the two.
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  GainDrive:
    type: application
    platform: iOS
    sources:
      - path: GainDrive
        # Placeholders that hold the package layout in git. Without these
        # excludes XcodeGen would treat an unknown file type as a resource and
        # copy it into the app.
        excludes:
          - ".gitkeep"
          - "**/.gitkeep"
      # Neither of these is a bundle resource — the plist is the target's own,
      # and the entitlements are consumed by the code signer. Including either
      # as a resource would copy a second, redundant, confusing copy into the
      # app. PrivacyInfo.xcprivacy is the one file here that *is* a resource.
      - path: Resources
        excludes:
          - Info.plist
          - GainDrive.entitlements
    settings:
      groups:
        - catalyst
      base:
        PRODUCT_NAME: GainDrive
        # Debug and release share this deliberately, so switching between them
        # replaces the app in place and keeps the configured servers.
        PRODUCT_BUNDLE_IDENTIFIER: org.gaindrive.ios
        # From the repository's root VERSION file, which the Makefile reads and
        # exports before running xcodegen. These are not spelled out here on
        # purpose: the same two numbers drive the server and the Android app,
        # and a copy would be a fourth one to forget. `make generate` refuses to
        # run if it cannot read them, since XcodeGen substitutes an unset
        # variable with nothing and a versionless project only fails much later,
        # at App Store validation.
        MARKETING_VERSION: "${GAINDRIVE_VERSION}"
        CURRENT_PROJECT_VERSION: "${GAINDRIVE_BUILD}"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        # iPhone and iPad from one adaptive layout. The iPad idiom is also what
        # makes Mac Catalyst possible at all — a phone-only target is not
        # offered the destination.
        TARGETED_DEVICE_FAMILY: "1,2"

        # Required by Catalyst, which must adopt the App Sandbox; the file also
        # carries the outgoing-network permission without which the app cannot
        # reach a server at all.
        #
        # Scoped to the Mac build rather than applied to both. A Catalyst
        # target compiles against the macOS SDK, which is what the condition
        # keys on, and the two entitlements in the file mean nothing on iOS —
        # where the app is sandboxed unconditionally and may open outgoing
        # connections without asking. Handing them to the iOS signer instead of
        # withholding them buys nothing and gives provisioning one more thing
        # to have an opinion about.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/GainDrive.entitlements

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        # `@testable import GainDrive` links against the app target's symbols
        # and needs this. XcodeGen's debug preset already sets it; stated
        # anyway, because the failure is a link error in the test bundle that
        # says nothing about testability.
        Debug:
          ENABLE_TESTABILITY: YES

  GainDriveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GainDriveTests
    dependencies:
      - target: GainDrive
    settings:
      # Same group as the app: a test bundle that does not support Catalyst is
      # not built for that destination, and `make test-mac` would then pass
      # without having run a thing.
      groups:
        - catalyst
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.gaindrive.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GainDrive:
    build:
      targets:
        GainDrive: all
        GainDriveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GainDriveTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
