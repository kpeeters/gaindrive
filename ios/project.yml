# The single source of truth for the Xcode project. GainDrive.xcodeproj is
# generated from this file and is not committed.
#
# Run `make` after changing anything here.

name: GainDrive

options:
  bundleIdPrefix: org.gaindrive
  deploymentTarget:
    iOS: "18.0"
    # The macOS contemporary of the iOS 18 floor, so an availability guard
    # never has to differ between the two.
    macOS: "15.0"
  createIntermediateGroups: true
  # Empty directories in the package layout are placeholders for phases that
  # have not landed yet; they should not become groups in the project.
  generateEmptyDirectories: false
  groupSortPosition: top

# Machine-local settings, chiefly DEVELOPMENT_TEAM, which differs per developer
# and must not be committed. `make` writes the file if it is missing, so
# generate through the Makefile rather than calling xcodegen directly.
#
# Nothing below may set DEVELOPMENT_TEAM: a build setting written into the
# project overrides the xcconfig, which would silently defeat this.
#
# The version settings below rely on that same precedence in the opposite
# direction, deliberately. Do not "tidy" them into this xcconfig: they would be
# overridden by the project and silently stop tracking the VERSION file.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

# Xcodegen's default, stated so the config names the Makefile and the
# xcconfig above refer to are visible in one place.
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Warnings are cheap here and the alternative is discovering the same
    # things at review time.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
  # Uncomment to restore the stock translucent (Liquid Glass) pinned list
  # headers that `pinnedHeaderBackground()` (UI/Components/Rows.swift)
  # otherwise paints opaque; then run `make generate`. Per config rather than
  # in `base:` above, because a base-level SWIFT_ACTIVE_COMPILATION_CONDITIONS
  # replaces XcodeGen's config presets and would silently drop DEBUG from
  # Debug builds.
  # configs:
  #   Debug:
  #     SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG GD_GLASS_HEADERS
  #   Release:
  #     SWIFT_ACTIVE_COMPILATION_CONDITIONS: GD_GLASS_HEADERS

# **One target, two platforms** (XcodeGen `supportedDestinations`, which is
# Xcode's multiplatform app). iPhone and iPad build against the iOS SDK; "My
# Mac" builds a native AppKit app from the same sources against the macOS SDK.
# It replaced the Mac Catalyst destination on 2026-09-29: Catalyst is the iPad
# app on the Mac, and its window chrome kept fighting the Mac's conventions.
# See `.ai/macos/PLAN.md` for the phases.
#
# Platform differences live in `#if os(...)` in code and in per-SDK build
# settings (`[sdk=macosx*]`) below. The test target lists the same
# destinations: one that did not would simply not be built for the Mac, and
# `make test-mac` would pass having run nothing.

targets:
  GainDrive:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: GainDrive
        # Placeholders that hold the package layout in git. Without these
        # excludes XcodeGen would treat an unknown file type as a resource and
        # copy it into the app.
        excludes:
          - ".gitkeep"
          - "**/.gitkeep"
      # Neither of these is a bundle resource - the plist is the target's own,
      # and the entitlements are consumed by the code signer. Including either
      # as a resource would copy a second, redundant, confusing copy into the
      # app. PrivacyInfo.xcprivacy is the one file here that *is* a resource.
      - path: Resources
        excludes:
          - Info.plist
          - GainDrive.entitlements
    settings:
      base:
        PRODUCT_NAME: GainDrive
        # Debug and release share this deliberately, so switching between them
        # replaces the app in place and keeps the configured servers.
        PRODUCT_BUNDLE_IDENTIFIER: org.gaindrive.ios-player
        # From the repository's root VERSION file, which the Makefile reads and
        # exports before running xcodegen. These are not spelled out here on
        # purpose: the same two numbers drive the server and the Android app,
        # and a copy would be a fourth one to forget. `make generate` refuses to
        # run if it cannot read them, since XcodeGen substitutes an unset
        # variable with nothing and a versionless project only fails much later,
        # at App Store validation.
        MARKETING_VERSION: "${GAINDRIVE_VERSION}"
        CURRENT_PROJECT_VERSION: "${GAINDRIVE_BUILD}"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        # iPhone and iPad from one adaptive layout; ignored by the Mac build.
        TARGETED_DEVICE_FAMILY: "1,2"

        # The Mac App Store requires the App Sandbox; the file also carries
        # the outgoing-network permission without which the app cannot reach
        # a server at all, and the keychain group.
        #
        # Scoped to the Mac build rather than applied to both. The Mac build
        # compiles against the macOS SDK, which is what the condition keys on,
        # and the entitlements in the file mean nothing on iOS -
        # where the app is sandboxed unconditionally and may open outgoing
        # connections without asking. Handing them to the iOS signer instead of
        # withholding them buys nothing and gives provisioning one more thing
        # to have an opinion about.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/GainDrive.entitlements

        # No debug dylib on the Mac. With it, a debug build's main executable
        # is a fixed stub with the same Mach-O UUID whatever the app, and
        # macOS local network privacy identifies a Mac app by that UUID - so
        # after the bundle id changed, nehelper mapped the new app to the old
        # one's record, never prompted, and every request to a server on the
        # LAN failed as "offline" (-1009, ENETDOWN, path satisfied). The dylib
        # only serves SwiftUI previews, which this project does not use.
        ENABLE_DEBUG_DYLIB[sdk=macosx*]: NO

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: NO
      configs:
        # `@testable import GainDrive` links against the app target's symbols
        # and needs this. XcodeGen's debug preset already sets it; stated
        # anyway, because the failure is a link error in the test bundle that
        # says nothing about testability.
        Debug:
          ENABLE_TESTABILITY: YES

  GainDriveTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: GainDriveTests
    dependencies:
      - target: GainDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.gaindrive.ios-player.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GainDrive:
    build:
      targets:
        GainDrive: all
        GainDriveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GainDriveTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
