name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04}
          # Re-enable once the repo is public: ubuntu-24.04-arm runners are
          # free for public repos only, and billed on a private one. Nothing
          # else needs changing - the build is arch-agnostic.
          # - {arch: arm64,  runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # An untagged build takes its version from VERSION too, not a literal
      # 0.0, so that what a binary reports is always the version of the tree it
      # was built from; the commit is what says it is not a release. The old
      # 0.0 made an artifact from master look like a version that exists
      # nowhere, and made the APK's filename disagree with the versionName
      # Gradle had already read out of the same file.
      - id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}";
          else v="$(sed -n 's/^version=//p' VERSION)-$(git rev-parse --short HEAD)"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      # The tag is what stamps the binary, so it keeps overriding the VERSION
      # file - but the two disagreeing means someone tagged without bumping,
      # and the release would then report a version no app built from the same
      # commit agrees with. This is the only place that can notice.
      - name: Tag agrees with VERSION
        if: github.ref_type == 'tag'
        run: |
          v=$(sed -n 's/^version=//p' VERSION)
          [ "${{ steps.ver.outputs.v }}" = "$v" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($v)"
            exit 1; }

      # Nine FetchContent repositories are cloned and built from source on a
      # cold run, libarchive and taglib among them.
      - uses: actions/cache@v4
        with:
          path: build-static/_deps
          key: deps-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt') }}

      # The Alpine package list and configure flags live in the script, so this
      # is reproducible locally as `cmake --build build --target static`.
      # Deliberately not a job-level `container:`: GitHub injects its own
      # glibc-linked node to run JS actions, so actions/checkout dies on musl
      # with `exec /__e/node20/bin/node: no such file or directory`. Keeping
      # checkout, cache and upload on the host avoids that entirely.
      - name: Build (alpine / musl, fully static)
        run: cmake -DVERSION=${{ steps.ver.outputs.v }} -P cmake/static_build.cmake

      - name: Verify
        run: |
          # Alpine's gcc defaults to PIE, so a static link can come out as
          # either ET_EXEC ("statically linked") or "static-pie linked".
          file build-static/gaindrive | grep -qE 'statically linked|static-pie linked'
          ./build-static/gaindrive --version
          mv build-static/gaindrive gaindrive-linux-${{ matrix.arch }}

      # These names are what html/docs.html already tells users to download.
      - uses: actions/upload-artifact@v4
        with:
          name: gaindrive-linux-${{ matrix.arch }}
          path: gaindrive-linux-${{ matrix.arch }}
          if-no-files-found: error

  # The default build: system packages, no network at configure time. Debian 13
  # is the only Linux that satisfies all seven - Ubuntu 24.04 ships taglib 1.13
  # against the taglib 2 API this code uses, and has no libreproc-dev - so the
  # runner's own image cannot serve and this runs in a container.
  system-deps:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libtag-dev libtinyxml2-dev libcxxopts-dev nlohmann-json3-dev \
            libsqlitecpp-dev libreproc-dev libarchive-dev libssl-dev

      # ALLOW_FETCH=OFF is the point of this job. Without it a dependency that
      # stopped resolving would be silently downloaded and the build would still
      # pass, so the job would no longer be testing anything.
      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DGAINDRIVE_INSTALL_SYSTEMD=OFF \
                -DGAINDRIVE_ALLOW_FETCH=OFF
          cmake --build build -j"$(nproc)"

      - name: Verify
        run: |
          ./build/gaindrive --version
          # Belt and braces: the flag above turns a missing package into a
          # configure error, this catches a fetch arriving by any other route.
          test ! -d build/_deps

  # Compile-only guard for the Darwin branches. macOS is distributed through the
  # Homebrew tap rather than as an artifact, so nothing is uploaded here - the
  # job exists because the Linux matrix cannot catch a Darwin regression, and
  # every one of them (TCP_KEEPIDLE, the timeval narrowing, FSEvents) is a hard
  # compile error that would otherwise surface in someone's `brew install`.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - run: |
          brew install ffmpeg openssl@3 taglib tinyxml2 cxxopts \
                       nlohmann-json sqlitecpp reproc libarchive

      # openssl@3 and libarchive are both keg-only, so neither is on the default
      # search path. libarchive matters especially: macOS ships its own, older
      # copy in /usr/lib, and without the prefix hint find_package would pick
      # that one up instead of the formula's.
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DGAINDRIVE_INSTALL_SYSTEMD=OFF \
                -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
                -DCMAKE_PREFIX_PATH="$(brew --prefix libarchive)"

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Verify
        run: |
          ./build/gaindrive --version
          # FSEvents lives in CoreServices; if the framework link were dropped
          # the folderwatcher branch would fail to link, but check anyway so a
          # silent fallback to the no-op stub cannot pass unnoticed.
          otool -L build/gaindrive | grep -q CoreServices
          test ! -d build/_deps

  # A workflow artifact is always a zip - actions/upload-artifact zips on
  # upload and offers no way not to - so it cannot be curl'd into place the way
  # html/docs.html documents. A release asset is served as the bare file, which
  # is why an untagged master build is published as one:
  #
  #   https://github.com/kpeeters/gaindrive/releases/tag/latest
  #
  # The same release carries the APK from android.yml, and both workflows go
  # through .github/actions/rolling-release so they cannot disagree about how
  # it is created. No stale-suffix here: gaindrive-linux-<arch> carries no
  # version, so --clobber replaces last build's binary rather than adding to it.
  latest:
    needs: build
    # Excludes pull_request too, where ref_name is `<n>/merge`.
    if: github.ref_type == 'branch' && github.ref_name == 'master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true, path: dist}
      - uses: ./.github/actions/rolling-release
        with:
          assets: dist/gaindrive-linux-*
          token: ${{ github.token }}

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true, path: dist}
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
        env: {GH_TOKEN: '${{ github.token }}'}
